name: CI Pipeline

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Python Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run tests with Pytest
        env:
          WHATSAPP_VERIFY_TOKEN: "test_verify_token"
        run: |
          pytest -v

      - name: Coverage de módulos tocados (100%)
        run: |
          pytest -v             --cov=app.services.llm             --cov=app.services.llm_providers.base             --cov=app.services.llm_providers.gemini             --cov=app.services.llm_providers.mistral             --cov=app.services.conversation             --cov=testing             --cov-report=term-missing             --cov-fail-under=100
        env:
          WHATSAPP_VERIFY_TOKEN: "test_verify_token"

      - name: Lint with Ruff
        run: |
          ruff check .